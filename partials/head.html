<!-- Self-hosted brand font, requested before the stylesheet needs it -->
<link rel="preload" href="assets/fonts/YekanBakh-VF.woff2" as="font" type="font/woff2" crossorigin />

<script>if (location.protocol === "file:") document.write('<script src="assets/fonts/yekan-bakh-local-preview.js"><\/script>');</script>
<link rel="stylesheet" href="assets/css/main.css" />
<!-- Without JavaScript nothing should stay hidden by the scroll animations -->
<noscript><style>[data-reveal]{opacity:1!important;translate:none!important}</style></noscript>
